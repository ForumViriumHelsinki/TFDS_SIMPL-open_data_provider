serviceAccount:
  name: sdtooling-api-be-service-account

# ID of persistentVolumeClaims associated with NFS Storage
schemaVolumeClaim: nfs-storage-pvc

# configuration for connectivity between SD-Tooling-Api-Be and SD-Tooling-Api-Validation
validation:
  config:
    domain: "http://sd-validation:8080"

connectorAdapter:
  service:
    url:  http://edc-connector-adapter:8080

# url to the AuthenticationProvider internal service
authenticationProvider:
  service:
    url: http://authentication-provider:8080

# absolute path to the schema repository synced by the schema-synch-adapter
schemaSyncService:
  repositoryPath: /home/simpluser/data/schemas/provider

openTelemetry:
  disabled: true

# catalog adapter application (catalogue-adapter-service)
catalogueAdapter:
  tier2Gateway:
    # tier2 tls gateway path configured as route rule to the catalog adapter application
    pathPrefix: /adapter

# federated catalog application (fc-service)
federatedCatalogue:
  tier2Gateway:
    # URI to the tier2 tls gateway of the federated catalog application
    # tier2 tls gateway path configured as route rule to the federated catalog application
    pathPrefix: /fc

ingress:
  enabled: false

resourceDescription:
  id:
    # If true, always generates and overwrites any existing "@id" on resource description creation.
    # If false, generates a new "@id" only when it is absent or blank, preserving any value already set.
    forceGenerate: true
    # Optional prefix prepended to the generated UUID when building the resource ID.
    # If empty, only the UUID is used as the resource ID.
    prefix: "web:did:"

